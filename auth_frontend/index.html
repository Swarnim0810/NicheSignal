<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body { margin: 0; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: transparent;}
      button { 
          background-color: #E8824A; 
          color: white; 
          padding: 12px 24px; 
          border: none; 
          border-radius: 8px; 
          cursor: pointer; 
          font-weight: 600; 
          font-size: 14px;
          display: flex;
          align-items: center;
          gap: 10px;
          box-shadow: 0 4px 6px rgba(0,0,0,0.1);
          transition: background-color 0.2s;
      }
      button:hover { background-color: #C66A38; }
      #user-info { color: #F0E6D3; font-size: 14px; display: none; }
    </style>
  </head>
  <body>
    <button id="login-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Sign in with Google
    </button>
    <div id="user-info">Logged in</div>
    
    <script type="module">
      import { Streamlit } from "./streamlit.js";
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAG4A9llKPoCQXG9pPz-RYBHduchEZG5FU",
        authDomain: "nichesignal-99f3d.firebaseapp.com",
        projectId: "nichesignal-99f3d",
        storageBucket: "nichesignal-99f3d.firebasestorage.app",
        messagingSenderId: "276771992403",
        appId: "1:276771992403:web:f0fcabd4857a629265a7a6"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const provider = new GoogleAuthProvider();

      function sendValue(val) {
        Streamlit.setComponentValue(val);
      }

      function onRender(event) {
        Streamlit.setFrameHeight(60);
      }

      Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
      Streamlit.setComponentReady();

      document.getElementById('login-btn').addEventListener('click', () => {
        signInWithPopup(auth, provider).then((result) => {
          const user = result.user;
          sendValue({uid: user.uid, email: user.email, name: user.displayName});
          document.getElementById('login-btn').style.display = 'none';
          document.getElementById('user-info').style.display = 'block';
          document.getElementById('user-info').innerText = 'Welcome, ' + user.displayName;
        }).catch((err) => {
          console.error(err);
        });
      });

      onAuthStateChanged(auth, (user) => {
        if (user) {
          sendValue({uid: user.uid, email: user.email, name: user.displayName});
          document.getElementById('login-btn').style.display = 'none';
          document.getElementById('user-info').style.display = 'block';
          document.getElementById('user-info').innerText = 'Welcome, ' + user.displayName;
        }
      });
    </script>
  </body>
</html>
